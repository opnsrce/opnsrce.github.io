name: Deploy Hugo site (GitHub Actions Pages)

on:
  push:
    branches:
      - master
  schedule:
    - cron: '5 0 * * *' # daily at 00:05 UTC
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Cache Hugo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.HUGO_CACHEDIR }}
            resources
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/hugo.json','**/go.mod','**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@dc99976453b04b1029527154fc04fef80a4a49cf # v2
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build site
        run: hugo --gc --minify --config hugo.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
